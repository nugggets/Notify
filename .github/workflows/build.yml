name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses and install SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "Notify-v${VER}.apk"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Notify-apk
          path: Notify-v*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notify-${{ github.run_number }}
          name: "Notify v${{ steps.apk.outputs.ver }} (сборка ${{ github.run_number }})"
          body: "Приёмник ссылок: открывает в Chrome ссылки, присланные кнопкой «Открыть на втором телефоне» из ProfiMonitor."
          files: Notify-v*.apk
